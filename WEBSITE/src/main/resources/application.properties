server.port=8080
spring.application.name=car-rental-backend

# Run setup-database.bat once. Keep generated credentials on this PC only.
spring.config.import=optional:file:./database.local.properties
spring.datasource.url=jdbc:sqlserver://localhost:${CARRENTAL_DB_PORT:54465};databaseName=CarRentalDB;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=carrental_app
spring.datasource.password=${CARRENTAL_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Setup creates the tables; startup checks them without deleting data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.carrental=INFO
logging.level.org.springframework.web=INFO
